<!DOCTYPE html>

<html>

<head>

    <title>CloudDrop</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family:
                Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .container {

            width: 90%;

            max-width: 750px;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.1);
        }

        h1 {

            font-size: 38px;

            margin-bottom: 5px;
        }

        .subtitle {

            color: #666;

            margin-bottom: 35px;
        }

        .upload-box {

            border: 2px dashed #aaa;

            padding: 35px;

            text-align: center;

            border-radius: 15px;

            background: #fafafa;
        }

        input {

            margin: 15px;
        }

        button {

            background: #111827;

            color: white;

            border: none;

            padding: 12px 25px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;
        }

        button:hover {

            opacity: 0.85;
        }

        #result {

            margin-top: 25px;

            padding: 15px;

            border-radius: 10px;

            display: none;
        }

        .success {

            background: #dcfce7;

            color: #166534;
        }

        .error {

            background: #fee2e2;

            color: #991b1b;
        }

        .architecture {

            margin-top: 35px;

            padding: 20px;

            background: #f8fafc;

            border-radius: 12px;

        }

        .architecture h3 {

            margin-top: 0;
        }

        .flow {

            text-align: center;

            font-weight: bold;

            line-height: 2;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>☁️ CloudDrop</h1>

    <p class="subtitle">
        Cloud-Native File Storage & Processing Platform
    </p>


    <div class="upload-box">

        <h2>Upload Your File</h2>

        <input
            type="file"
            id="fileInput"
        >

        <br>

        <button onclick="uploadFile()">
            Upload to Cloud
        </button>

    </div>


    <div id="result"></div>


    <div class="architecture">

        <h3>Cloud Architecture</h3>

        <div class="flow">

            User

            ↓

            CloudDrop Flask Application

            ↓

            Amazon S3

        </div>

    </div>

</div>


<script>

async function uploadFile() {

    const input =
        document.getElementById(
            "fileInput"
        );

    const result =
        document.getElementById(
            "result"
        );


    if (!input.files.length) {

        result.style.display = "block";

        result.className = "error";

        result.innerText =
            "Please select a file.";

        return;
    }


    const formData =
        new FormData();

    formData.append(
        "file",
        input.files[0]
    );


    result.style.display = "block";

    result.className = "";

    result.innerText =
        "Uploading to Amazon S3...";


    try {

        const response =
            await fetch(
                "/upload",
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();


        if (data.success) {

            result.className =
                "success";

            result.innerHTML =

                "✓ " +
                data.message +
                "<br><br>" +

                "Uploaded at: " +
                data.time;

        } else {

            result.className =
                "error";

            result.innerText =
                data.message;
        }


    } catch (error) {

        result.className =
            "error";

        result.innerText =
            "Upload failed.";

    }

}

</script>

</body>

</html>
